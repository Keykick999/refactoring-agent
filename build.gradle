plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.aicompany'
version = '0.0.1-SNAPSHOT'
description = 'Agent Harness for LLM and Tool based agents'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'tools.jackson.core:jackson-databind'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'mcp.integration', providers.gradleProperty('mcp.integration').getOrElse('false')
	systemProperty 'llm.integration', providers.gradleProperty('llm.integration').getOrElse('false')
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}
